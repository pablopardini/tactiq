<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TACTIQ — Suite deportiva integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#05070a;
  --text:#f5f7fb;
  --text-dim:#7c8697;
  --line:#1b2436;
  --teal:#00e5aa;      --teal-rgb:0,229,170;
  --violet:#a78bfa;    --violet-rgb:167,139,250;
  --orange:#ff9f1c;    --orange-rgb:255,159,28;
  --font-display:'Space Grotesk',Arial,sans-serif;
  --font-body:'Inter',Arial,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html,body{width:100%;height:100%;font-family:var(--font-body);background:var(--bg);overflow:hidden;}

/* Piso 3D: la grilla ya no es una textura plana, es un plano inclinado con perspectiva real */
.bg-3d{position:fixed;inset:0;z-index:0;perspective:900px;overflow:hidden;pointer-events:none;}
.bg-grid{
  position:absolute;left:50%;top:50%;width:1900px;height:1900px;margin:-950px 0 0 -950px;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:64px 64px;
  transform:rotateX(62deg);
  transition:transform .6s cubic-bezier(.22,.9,.34,1);
  mask-image:radial-gradient(circle at 50% 50%,black 0%,transparent 60%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,black 0%,transparent 60%);
}

/* Pings de radar que salen del centro, como si el club emitiera la señal */
.radar-bg{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.radar-bg span{position:absolute;width:130px;height:130px;border-radius:50%;opacity:0;border:2px solid rgba(var(--teal-rgb),.4);animation:radarPing 4.5s ease-out infinite;}
.radar-bg span:nth-child(1){animation-delay:1.6s;}
.radar-bg span:nth-child(2){border-color:rgba(var(--violet-rgb),.35);animation-delay:3.1s;}
.radar-bg span:nth-child(3){border-color:rgba(var(--orange-rgb),.35);animation-delay:4.6s;}
@keyframes radarPing{
  0%{transform:scale(.6);opacity:.5;border-width:2px;}
  85%{opacity:.08;}
  100%{transform:scale(9);opacity:0;border-width:.4px;}
}

.scanline{position:fixed;left:0;right:0;top:-40%;height:38%;z-index:0;pointer-events:none;opacity:.6;background:linear-gradient(180deg,transparent,rgba(255,255,255,.045),transparent);animation:scanMove 11s linear infinite 2.4s;}
@keyframes scanMove{0%{transform:translateY(-10vh);}100%{transform:translateY(150vh);}}

/* Resplandores de fondo: el wrapper hace el parallax, el glow interior sigue con su respiración */
.glow-wrap{position:fixed;z-index:0;pointer-events:none;transition:transform .4s ease-out;}
.gw1{top:-120px;left:10%;}
.gw2{top:-120px;right:10%;}
.gw3{bottom:-160px;left:38%;}
.glow{position:relative;width:420px;height:420px;border-radius:50%;filter:blur(60px);opacity:0;animation:glowIn 2.2s ease forwards, breathe 7s ease-in-out infinite 2.2s;}
.glow.g1{background:var(--teal);animation-delay:.1s, 2.3s;}
.glow.g2{background:var(--violet);animation-delay:.25s, 2.45s;}
.glow.g3{background:var(--orange);animation-delay:.4s, 2.6s;}
@keyframes glowIn{to{opacity:.14;}}
@keyframes breathe{0%,100%{opacity:.14;transform:scale(1);}50%{opacity:.22;transform:scale(1.12);}}

.stage{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.brandwrap{position:absolute;top:56px;display:flex;flex-direction:column;align-items:center;opacity:0;animation:fadeDown .7s ease forwards .1s;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:4px;color:var(--text-dim);margin-bottom:10px;opacity:.85;}
h1{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:6px;color:#fff;text-align:center;}
.sub{margin-top:8px;font-family:var(--font-body);font-size:13px;color:var(--text-dim);text-align:center;}

.diagram{position:relative;width:640px;height:640px;perspective:1400px;transform-origin:center center;}
.scene{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.9,.34,1);}

svg.lines{position:absolute;inset:0;overflow:visible;filter:drop-shadow(0 0 2px rgba(255,255,255,.12));}
.line-path{
  fill:none;stroke-width:1.5;stroke-dasharray:6 7;
  stroke-dashoffset:500;opacity:0;
  animation:drawLine 1.1s ease forwards, dashFlow 2.4s linear infinite;
}
@keyframes drawLine{to{stroke-dashoffset:0;opacity:1;}}
@keyframes dashFlow{to{stroke-dashoffset:-260;}}
.l1{stroke:rgba(var(--teal-rgb),.4);animation-delay:.55s, 1.7s;}
.l2{stroke:rgba(var(--violet-rgb),.4);animation-delay:.65s, 1.7s;}
.l3{stroke:rgba(var(--orange-rgb),.4);animation-delay:.75s, 1.7s;}

.flowdot{filter:drop-shadow(0 0 5px currentColor);}

/* Núcleo: esfera con anillo radar */
.core-wrap{position:absolute;top:50%;left:50%;width:170px;height:170px;transform:translate(-50%,-50%) translateZ(70px) scale(0);transform-style:preserve-3d;z-index:3;animation:coreIn .6s cubic-bezier(.34,1.56,.64,1) forwards .05s;}
@keyframes coreIn{to{transform:translate(-50%,-50%) translateZ(70px) scale(1);}}

.radar-ring{position:absolute;inset:-14px;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(var(--teal-rgb),.95) 10deg, transparent 55deg, transparent 360deg);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  filter:drop-shadow(0 0 6px rgba(var(--teal-rgb),.55));
  animation:spin 5s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.core{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 32% 26%, #ffffff 0%, #e7ecf5 32%, #b9c2d1 68%, #8891a0 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:13px;font-weight:800;color:var(--bg);letter-spacing:1px;text-align:center;
  box-shadow:0 18px 34px rgba(0,0,0,.55),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 8px 14px rgba(255,255,255,.7);
  animation:corePulse 3.4s ease-in-out infinite 1.4s;
}
@keyframes corePulse{
  0%,100%{box-shadow:0 18px 34px rgba(0,0,0,.55),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 8px 14px rgba(255,255,255,.7),0 0 0 rgba(255,255,255,0);}
  50%{box-shadow:0 18px 34px rgba(0,0,0,.55),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 8px 14px rgba(255,255,255,.7),0 0 55px rgba(255,255,255,.35);}
}

/* Nodos: fichas de vidrio con inclinación 3D real */
.node{
  position:absolute;width:190px;height:190px;
  text-decoration:none;-webkit-tap-highlight-color:transparent;
  opacity:0;transform:translateZ(0) scale(.4);
  z-index:2;perspective:800px;
  animation:nodeIn .55s cubic-bezier(.34,1.56,.64,1) forwards var(--delay), float 5s ease-in-out infinite var(--float-delay);
}
@keyframes nodeIn{to{opacity:1;transform:translateZ(0) scale(1);}}
@keyframes float{0%,100%{transform:translateZ(0) translateY(0) scale(1);}50%{transform:translateZ(0) translateY(-9px) scale(1);}}

.node-inner{
  width:100%;height:100%;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 60%), rgba(10,13,20,.55);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1.5px solid rgba(var(--c-rgb),.5);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 -18px 30px -18px rgba(0,0,0,.7) inset, 0 22px 34px -16px rgba(0,0,0,.65);
  transform-style:preserve-3d;
  transition:transform .18s ease-out, box-shadow .25s ease, border-color .25s ease;
}
.node:hover .node-inner, .node:focus-visible .node-inner{
  border-color:rgba(var(--c-rgb),.9);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 -18px 30px -18px rgba(0,0,0,.7) inset, 0 30px 50px -18px rgba(0,0,0,.7), 0 0 46px rgba(var(--c-rgb),.5);
}
.node:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:50%;}

.node .ico{font-size:32px;margin-bottom:8px;transition:transform .25s ease;transform:translateZ(4px);}
.node:hover .ico{transform:scale(1.12) translateZ(14px);}
.node .lbl{font-family:var(--font-display);font-size:13px;font-weight:700;color:#fff;letter-spacing:.4px;text-align:center;padding:0 14px;}
.node .tag{font-family:var(--font-mono);font-size:10px;color:var(--c);font-weight:600;letter-spacing:2px;margin-top:5px;}
.node .caps{font-family:var(--font-mono);font-size:8.5px;color:var(--text-dim);letter-spacing:.2px;margin-top:7px;text-align:center;padding:0 16px;}

.n1{--c:var(--teal);--c-rgb:var(--teal-rgb);top:10px;left:0;--delay:.9s;--float-delay:1.6s;}
.n2{--c:var(--violet);--c-rgb:var(--violet-rgb);top:10px;right:0;--delay:1.0s;--float-delay:1.85s;}
.n3{--c:var(--orange);--c-rgb:var(--orange-rgb);bottom:0;left:225px;--delay:1.1s;--float-delay:2.1s;}

footer{position:absolute;bottom:34px;display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);opacity:0;animation:fadeDown .7s ease forwards 1.5s;flex-wrap:wrap;justify-content:center;padding:0 20px;text-align:center;}
footer a{color:var(--text-dim);text-decoration:none;border-bottom:1px solid transparent;transition:color .2s ease,border-color .2s ease;}
footer a:hover, footer a:focus-visible{color:var(--text);border-color:var(--text-dim);}
footer .dot{opacity:.5;}

a:focus-visible{outline:2px solid #fff;outline-offset:3px;}

@media (max-width:900px){
  .diagram{transform:scale(.72);}
}
@media (max-width:640px){
  .diagram{transform:scale(.5);}
  h1{font-size:14px;letter-spacing:4px;}
  .eyebrow{font-size:9px;letter-spacing:3px;}
  .sub{font-size:12px;}
  .brandwrap{top:34px;}
  footer{font-size:9.5px;bottom:20px;}
}
@media (max-width:380px){
  .diagram{transform:scale(.4);}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;}
  .scanline{display:none;}
}

/* ═══════════════════════════════════════
   SPLASH DE BIENVENIDA — escena 3D animada
   ═══════════════════════════════════════ */
#tqSplash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at 50% 40%,#0a1420,var(--bg) 70%);
  overflow:hidden;
  animation:tqSplashOut .8s ease forwards 4.4s;
}
#tqSplashCanvas{
  position:absolute;inset:0;width:100%;height:100%;display:block;
}
.tqSplashGlow{
  position:absolute;left:50%;top:42%;width:460px;height:460px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(var(--teal-rgb),.30),transparent 70%);
  filter:blur(50px);opacity:0;pointer-events:none;
  animation:tqGlowPulse 2.2s ease-in-out forwards;
}
.tqSplashLogo{
  width:148px;height:148px;position:absolute;left:50%;top:42%;z-index:1;
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  filter:drop-shadow(0 0 26px rgba(var(--teal-rgb),.55));
  animation:tqLogoIn .7s cubic-bezier(.34,1.56,.64,1) forwards .1s;
}
.tqHexFill{fill:#00d4aa;}
.tqHexOutline{
  fill:none;stroke:#00ffcc;stroke-width:3;stroke-dasharray:960;stroke-dashoffset:960;
  animation:tqDraw 1s ease forwards .15s;
}
.tqHexLine{stroke:rgba(0,0,0,.22);stroke-width:5;}
.tqHexT{font-family:var(--font-display);font-size:165px;font-weight:900;fill:#04120e;text-anchor:middle;}
.tqSplashText{
  position:absolute;left:50%;bottom:13%;transform:translateX(-50%);
  z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.tqSplashWord{
  font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:7px;color:var(--text);
  opacity:0;animation:tqWordIn .6s ease forwards 1.4s;
}
.tqSplashSub{
  font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:1px;
  opacity:0;min-width:200px;text-align:center;
  animation:tqWordIn .6s ease forwards 1.65s;
}
.tqSplashBar{
  width:200px;height:2px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;
  opacity:0;animation:tqWordIn .6s ease forwards 1.8s;
}
.tqSplashBarFill{
  height:100%;width:0%;border-radius:2px;
  background:linear-gradient(90deg,var(--teal),var(--violet),var(--orange));
  animation:tqBarFill 2.6s cubic-bezier(.3,.6,.3,1) forwards 1.8s;
}
@keyframes tqGlowPulse{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}60%{opacity:.85;}100%{opacity:.5;transform:translate(-50%,-50%) scale(1.2);}}
@keyframes tqLogoIn{
  0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg);opacity:0;}
  60%{transform:translate(-50%,-50%) scale(1.08) rotate(3deg);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1;}
}
@keyframes tqDraw{to{stroke-dashoffset:0;}}
@keyframes tqWordIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes tqBarFill{to{width:100%;}}
@keyframes tqSplashOut{to{opacity:0;visibility:hidden;pointer-events:none;}}
@media (prefers-reduced-motion: reduce){
  #tqSplash{animation:tqSplashOut .3s ease forwards .35s;}
  #tqSplashCanvas{display:none !important;}
  .tqSplashLogo{display:block !important;}
  .tqSplashGlow,.tqSplashLogo,.tqHexOutline,.tqSplashWord,.tqSplashSub,.tqSplashBar,.tqSplashBarFill{
    animation:none !important;opacity:1 !important;transform:translate(-50%,-50%) !important;stroke-dashoffset:0 !important;width:100% !important;
  }
}
</style>
</head>

<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var scene = document.getElementById('scene');
  var diagram = document.getElementById('diagram');

  if(canHover && !reduceMotion){
    var bgGrid = document.getElementById('bgGrid');
    var gw1 = document.getElementById('gw1');
    var gw2 = document.getElementById('gw2');
    var gw3 = document.getElementById('gw3');
    window.addEventListener('mousemove', function(e){
      var wx = e.clientX / window.innerWidth - .5;
      var wy = e.clientY / window.innerHeight - .5;
      if(bgGrid) bgGrid.style.transform = 'rotateX(' + (62 + wy * -7).toFixed(2) + 'deg) rotateY(' + (wx * 9).toFixed(2) + 'deg)';
      if(gw1) gw1.style.transform = 'translate(' + (wx * -16).toFixed(1) + 'px,' + (wy * -12).toFixed(1) + 'px)';
      if(gw2) gw2.style.transform = 'translate(' + (wx * 20).toFixed(1) + 'px,' + (wy * -16).toFixed(1) + 'px)';
      if(gw3) gw3.style.transform = 'translate(' + (wx * -12).toFixed(1) + 'px,' + (wy * 18).toFixed(1) + 'px)';
    });
  }

  if(canHover && !reduceMotion && scene && diagram){
    diagram.addEventListener('mousemove', function(e){
      var r = diagram.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - .5;
      var py = (e.clientY - r.top) / r.height - .5;
      scene.style.transform = 'rotateX(' + (py * -9).toFixed(2) + 'deg) rotateY(' + (px * 9).toFixed(2) + 'deg)';
    });
    diagram.addEventListener('mouseleave', function(){
      scene.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    var nodes = document.querySelectorAll('.node');
    for(var i = 0; i < nodes.length; i++){
      (function(node){
        var inner = node.querySelector('.node-inner');
        node.addEventListener('mousemove', function(e){
          var r = node.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width - .5;
          var py = (e.clientY - r.top) / r.height - .5;
          inner.style.transform = 'translateZ(46px) rotateX(' + (py * -16).toFixed(2) + 'deg) rotateY(' + (px * 16).toFixed(2) + 'deg) scale(1.045)';
        });
        node.addEventListener('mouseleave', function(){
          inner.style.transform = '';
        });
      })(nodes[i]);
    }
  }
})();
</script>

<!-- ═══ ESCENA 3D DEL SPLASH (Three.js) ═══ -->
<script>
function tqSplashFallback(){
  var c=document.getElementById('tqSplashCanvas'); if(c)c.style.display='none';
  var f=document.getElementById('tqSplashFallbackLogo'); if(f)f.style.display='block';
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="tqSplashFallback()"></script>
<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var splash = document.getElementById('tqSplash');
  var subEl = document.getElementById('tqSplashSub');
  var canvas = document.getElementById('tqSplashCanvas');

  if(reduceMotion){
    setTimeout(function(){ if(splash) splash.style.display='none'; }, 700);
    tqSplashFallback();
    return;
  }

  // Mensajes de carga escalonados
  [[0,'Iniciando sistemas…'],[1100,'Cargando módulos…'],[2300,'Sincronizando datos…'],[3300,'Listo ✓']]
    .forEach(function(s){ setTimeout(function(){ if(subEl) subEl.textContent = s[1]; }, s[0]); });

  setTimeout(function(){ if(splash) splash.style.display='none'; }, 5200);

  if(typeof THREE==='undefined'){ tqSplashFallback(); return; }

  try{
    var W=window.innerWidth, H=window.innerHeight;
    var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
    renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setClearColor(0x000000,0);

    var scene=new THREE.Scene();
    scene.fog=new THREE.FogExp2(0x05070a,0.05);
    var camera=new THREE.PerspectiveCamera(48,W/H,0.1,100);
    camera.position.set(0,0.35,7.4);

    scene.add(new THREE.AmbientLight(0x0a1a2a,4));
    var lT1=new THREE.PointLight(0x00e5aa,10,18); lT1.position.set(4,3,5); scene.add(lT1);
    var lT2=new THREE.PointLight(0x3d9eff,6,15); lT2.position.set(-4,-1,4); scene.add(lT2);
    var lT3=new THREE.PointLight(0xa78bfa,5,13); lT3.position.set(0,3,-3); scene.add(lT3);

    // ---- Núcleo hexagonal ----
    var core=new THREE.Group(); scene.add(core);
    var hexGeo=new THREE.CylinderGeometry(1.5,1.5,0.55,6);
    var hexMat=new THREE.MeshStandardMaterial({color:0x0a3d33,metalness:.55,roughness:.1,transparent:true,opacity:.3,emissive:0x00e5aa,emissiveIntensity:.28,side:THREE.DoubleSide});
    var hex=new THREE.Mesh(hexGeo,hexMat); hex.rotation.x=Math.PI/2; core.add(hex);
    var wire=new THREE.LineSegments(new THREE.EdgesGeometry(hexGeo),new THREE.LineBasicMaterial({color:0x00ffcc,transparent:true,opacity:.95}));
    wire.rotation.x=Math.PI/2; core.add(wire);

    var tShape=new THREE.Shape();
    tShape.moveTo(-0.6,0.6);tShape.lineTo(0.6,0.6);tShape.lineTo(0.6,0.3);tShape.lineTo(0.18,0.3);
    tShape.lineTo(0.18,-0.65);tShape.lineTo(-0.18,-0.65);tShape.lineTo(-0.18,0.3);tShape.lineTo(-0.6,0.3);tShape.closePath();
    var tGeo=new THREE.ExtrudeGeometry(tShape,{depth:0.42,bevelEnabled:true,bevelSize:.04,bevelThickness:.04,bevelSegments:3});
    tGeo.center();
    var tMat=new THREE.MeshStandardMaterial({color:0x00ffcc,metalness:.3,roughness:.1,emissive:0x00ffaa,emissiveIntensity:1.5});
    var tMesh=new THREE.Mesh(tGeo,tMat); core.add(tMesh);

    var rings=[];
    [[1.85,0x00e5aa,.5],[2.05,0x3d9eff,.42],[2.28,0xa78bfa,.36],[2.5,0x00ffcc,.28]].forEach(function(rr,i){
      var ring=new THREE.Mesh(new THREE.TorusGeometry(rr[0],0.012,6,90),new THREE.MeshBasicMaterial({color:rr[1],transparent:true,opacity:rr[2]}));
      ring.rotation.x=(i%2? .5:-.4)+i*0.2; ring.rotation.y=i*0.35;
      core.add(ring);
      rings.push({mesh:ring,sp:0.0035*(i%2?-1:1)*(1+i*0.2)});
    });

    // ---- Fondo estrellado ----
    var starGeo=new THREE.BufferGeometry(); var starN=260, starP=new Float32Array(starN*3);
    for(var i=0;i<starN;i++){
      var ph=Math.acos(2*Math.random()-1), th=Math.random()*Math.PI*2, r=4+Math.random()*7;
      starP[i*3]=r*Math.sin(ph)*Math.cos(th); starP[i*3+1]=r*Math.cos(ph); starP[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    }
    starGeo.setAttribute('position',new THREE.BufferAttribute(starP,3));
    var stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x00e5aa,size:.02,transparent:true,opacity:.5}));
    scene.add(stars);

    // ---- Sonda / androide futurista (núcleo facetado + anillos giroscópicos + visor) ----
    var bot=new THREE.Group(); scene.add(bot);
    var botCore=new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.19,0),
      new THREE.MeshStandardMaterial({color:0x0c1622,metalness:.9,roughness:.2,emissive:0x123a4a,emissiveIntensity:.5,flatShading:true})
    );
    bot.add(botCore);
    var gyro1=new THREE.Mesh(new THREE.TorusGeometry(0.3,0.011,6,60),new THREE.MeshBasicMaterial({color:0x3d9eff,transparent:true,opacity:.9}));
    gyro1.rotation.x=Math.PI/2.6; bot.add(gyro1);
    var gyro2=new THREE.Mesh(new THREE.TorusGeometry(0.35,0.009,6,60),new THREE.MeshBasicMaterial({color:0x00ffcc,transparent:true,opacity:.5}));
    gyro2.rotation.x=Math.PI/2.6; gyro2.rotation.y=Math.PI/2; bot.add(gyro2);
    // Visor óptico — barra fina que escanea de lado a lado
    var visor=new THREE.Mesh(
      new THREE.BoxGeometry(0.22,0.02,0.02),
      new THREE.MeshStandardMaterial({color:0x00ffee,emissive:0x00ffee,emissiveIntensity:2.6})
    );
    visor.position.set(0,0.01,0.19); bot.add(visor);
    var visorLight=new THREE.PointLight(0x00ffee,2.6,2.4); visorLight.position.copy(visor.position); bot.add(visorLight);
    // Aletas angulares estabilizadoras (en vez de antenas)
    [-1,1].forEach(function(side){
      var finShape=new THREE.Shape();
      finShape.moveTo(0,0); finShape.lineTo(0.03,0.17); finShape.lineTo(-0.02,0.21); finShape.lineTo(-0.05,0.05); finShape.closePath();
      var finGeo=new THREE.ExtrudeGeometry(finShape,{depth:0.015,bevelEnabled:false});
      var fin=new THREE.Mesh(finGeo,new THREE.MeshStandardMaterial({color:0x1a2740,metalness:.85,roughness:.25,emissive:0x3d9eff,emissiveIntensity:.3}));
      fin.position.set(side*0.15,-0.03,0); fin.rotation.z=side*0.55;
      bot.add(fin);
    });

    var t=0, botAngle=Math.random()*Math.PI*2, animId;
    function animate(){
      animId=requestAnimationFrame(animate);
      t+=0.014;
      core.rotation.y+=0.006;
      core.rotation.x=Math.sin(t*0.3)*0.12;
      rings.forEach(function(r){ r.mesh.rotation.z+=r.sp; r.mesh.rotation.y+=r.sp*0.4; });
      hexMat.emissiveIntensity=0.22+Math.sin(t*1.6)*0.08;
      tMat.emissiveIntensity=1.3+Math.sin(t*2.1)*0.4;
      stars.rotation.y+=0.0009;

      botAngle+=0.016;
      var rad=3.1;
      bot.position.set(Math.cos(botAngle)*rad, 0.5+Math.sin(t*1.2)*0.18, Math.sin(botAngle)*rad*0.6);
      bot.rotation.y=-botAngle+Math.PI/2;
      botCore.rotation.x+=0.01; botCore.rotation.y+=0.014;
      gyro1.rotation.z+=0.02; gyro2.rotation.z-=0.026;
      visor.position.x=Math.sin(t*1.7)*0.055;
      visor.material.emissiveIntensity=2.0+Math.sin(t*5)*1.0;
      visorLight.intensity=1.8+Math.sin(t*5)*1.0;

      camera.position.x=Math.sin(t*0.12)*0.6;
      camera.position.y=0.35+Math.sin(t*0.18)*0.15;
      camera.lookAt(0,0.15,0);

      renderer.render(scene,camera);
    }
    animate();
    setTimeout(function(){ cancelAnimationFrame(animId); },5300);

    window.addEventListener('resize',function(){
      var w=window.innerWidth,h=window.innerHeight;
      renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
    });
  }catch(e){
    tqSplashFallback();
  }
})();
</script>
</body>
</html>
